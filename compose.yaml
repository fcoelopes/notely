services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notely
      POSTGRES_USER: notely
      POSTGRES_PASSWORD: notely
    ports:
      - "5432:5432"
    volumes:
      - notely-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notely -d notely"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    build:
      context: infra/minio
    image: notely-minio:RELEASE.2025-10-15T17-29-55Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-notely}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-notely-development-only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - notely-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  clamav:
    image: clamav/clamav:1.4
    environment:
      CLAMD_CONF_StreamMaxLength: 100M
      CLAMD_CONF_MaxFileSize: 100M
      CLAMD_CONF_MaxScanSize: 100M
    ports:
      - "3310:3310"
    volumes:
      - notely-clamav-data:/var/lib/clamav

volumes:
  notely-postgres-data:
  notely-minio-data:
  notely-clamav-data:
